<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Junaid Khan — Software Engineering Student</title>
  <desc id="desc">A navy and blue gradient banner with abstract geometric accents.</desc>
  <defs>
